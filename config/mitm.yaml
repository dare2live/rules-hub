# [mitm] hostname 的推导规则
#
# QX 的 hostname 必须写明解密哪些主机，重写才会生效；上游重写文件里绝大多数
# 是裸规则（没有 hostname 行），所以从规则本身反推。只解密「确实有重写规则」
# 的主机，比无脑 MITM 全网更省电，也更不容易搞坏证书校验。

# 合法主机名：允许 *. 前缀
host_regex: '^(?:\*\.)?(?:[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,24}$'

# 这些是「二级后缀」，通配目标要取三级而不是二级，
# 否则 *.com.cn 等于把全国 .cn 站点都 MITM 了。
multi_tld:
  - com.cn
  - net.cn
  - org.cn
  - gov.cn
  - edu.cn
  - ac.cn
  - co.uk
  - com.hk
  - com.tw
  - co.jp
  - com.sg

# 正则写法无法机械转换时的手工映射
# 注意：不要让常见大厂的泛正则退化成 *.meituan.com / *.amap.com / *.weibo.com 等整域通配，
# 否则会把图片 CDN、视频流、地图瓦片、长连接全部拉进 TLS MITM，触发 QUIC 降级或证书锁定超时。
overrides:
  .*\.xima\..*\.com:
    - '*.ximalaya.com'
  xima\..*\.com:
    - '*.ximalaya.com'
  .*flyert.*:
    - '*.flyert.com'
  .*zhijianmedia\.cn:
    - '*.zhijianmedia.cn'
  .*\.amap\.com:
    - m5.amap.com
    - m5-zb.amap.com
    - dualstack-m5.amap.com
    - oss.amap.com
    - optimus-ads.amap.com
    - u5.amap.com
    - page.amap.com
  (g-)?acs\.m\.goofish\.com:
    - acs.m.goofish.com
    - g-acs.m.goofish.com
  m?api\.weibo\.cn:
    - api.weibo.cn
    - mapi.weibo.cn
  m?api\.weibo\.com:
    - api.weibo.com
    - mapi.weibo.com
  .*cupid\.iqiyi\.com:
    - '*.cupid.iqiyi.com'
    - t7z.cupid.iqiyi.com
  '[a-z]+\.eastmoney\.com':
    - emdcad.eastmoney.com
    - app.eastmoney.com
  .*\.meituan\.com:
    - api.meituan.com
    - mapi.meituan.com
    - i.meituan.com
    - waimaiapi.meituan.com
  interface(\d)?\.music\.163\.com:
    - interface.music.163.com
    - interface3.music.163.com

# 银行 / 支付 / 12306 不解密。
#
# 这不是「防广告」，是防「MITM 失败的后果」：这几类的证书校验一旦出问题，
# 后果是 App 打不开、付不了款，比多一个开屏广告严重得多。
# 其余类别（政务、苹果、微信）不做排除 —— 实测拦掉的都是广告位域名，
# 为了「万一」放弃拦截不划算。
#
# 注意粒度：这里写的是后缀，命中推导出的具体主机（如 adv.ccb.com）。
# 推导不会产生 *.ccb.com 这种整域通配，所以不会把整个银行解密掉。
deny_suffix:
  # 银行
  - bankcomm.com
  - bankcomm.cn
  - ccb.com
  - ecitic.com
  - pingan.com
  - spdb.com.cn
  - icbc.com.cn
  - abchina.com
  - boc.cn
  - cmbchina.com
  - psbc.com
  # 支付 / 征信
  - unionpay.com
  - 95516.com
  - alipay.com
  - tenpay.com
  # 出行凭证
  - 12306.cn
deny_exact:
  - '*.com.cn'
  - '*.net.cn'
  - '*.org.cn'
  - '*.gov.cn'
  - '*.com'
  - '*.cn'
  # 禁止国内高频超级 App 整域通配（具体业务接口已由 overrides 精确指定）
  - '*.baidu.com'
  - '*.meituan.com'
  - '*.iqiyi.com'
  - '*.amap.com'
  - '*.eastmoney.com'
  - '*.goofish.com'
  - '*.weibo.com'
  - '*.weibo.cn'
  - '*.163.com'
