# [mitm] hostname 的推导规则
#
# QX 的 hostname 必须写明解密哪些主机，重写才会生效；上游重写文件里绝大多数
# 是裸规则（没有 hostname 行），所以从规则本身反推。只解密「确实有重写规则」
# 的主机，比无脑 MITM 全网更省电，也更不容易搞坏证书校验。

# 合法主机名：允许 *. 前缀
host_regex: '^(?:\*\.)?(?:[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,24}$'

# 这些是「二级后缀」，通配目标要取三级而不是二级，
# 否则 *.com.cn 等于把全国 .cn 站点都 MITM 了。
multi_tld:
  - com.cn
  - net.cn
  - org.cn
  - gov.cn
  - edu.cn
  - ac.cn
  - co.uk
  - com.hk
  - com.tw
  - co.jp
  - com.sg

# 正则写法无法机械转换时的手工映射
overrides:
  .*\.xima\..*\.com:
    - '*.ximalaya.com'
  xima\..*\.com:
    - '*.ximalaya.com'
  .*flyert.*:
    - '*.flyert.com'
  .*zhijianmedia\.cn:
    - '*.zhijianmedia.cn'

# 技术护栏：拦截「无意义的通配目标」。
#
# 不是业务策略，不按「银行 / 政务 / 苹果」分类排除 —— 因为推导出来的主机名是
# 重写规则里明确写着的那一个（例如 adv.ccb.com 这种开屏广告域名），并不是整个
# ccb.com。为了「万一」而放弃这些广告拦截并不划算。
#
# 真正要拦的是 *.com / *.cn 这类公网后缀：写成 hostname 等于让 QX 解密整个互联网，
# 既没有对应规则，也会把性能拖垮。多级后缀（com.cn 等）由 multi_tld 在推导时处理。
deny_exact:
  - '*.com.cn'
  - '*.net.cn'
  - '*.org.cn'
  - '*.gov.cn'
  - '*.com'
  - '*.cn'
