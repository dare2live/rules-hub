# [mitm] hostname 的推导规则
#
# QX 的 hostname 必须写明解密哪些主机，重写才会生效；上游重写文件里绝大多数
# 是裸规则（没有 hostname 行），所以从规则本身反推。只解密「确实有重写规则」
# 的主机，比无脑 MITM 全网更省电，也更不容易搞坏证书校验。

# 合法主机名：允许 *. 前缀或首标签含 * 通配（如 *-spclient.spotify.com / interface*.music.163.com）
host_regex: '^(?:\*\.|[A-Za-z0-9\*][A-Za-z0-9\-\*]{0,61}\.)(?:[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?\.)*[A-Za-z]{2,24}$'

# 这些是「二级后缀」，通配目标要取三级而不是二级，
# 否则 *.com.cn 等于把全国 .cn 站点都 MITM 了。
multi_tld:
  - com.cn
  - net.cn
  - org.cn
  - gov.cn
  - edu.cn
  - ac.cn
  - co.uk
  - com.hk
  - com.tw
  - co.jp
  - com.sg

# 正则写法无法机械转换时的手工映射
# 注意：不要让常见大厂的泛正则退化成 *.meituan.com / *.amap.com / *.weibo.com 等整域通配，
# 否则会把图片 CDN、视频流、地图瓦片、长连接全部拉进 TLS MITM，触发 QUIC 降级或证书锁定超时。
overrides:
  .*\.xima\..*\.com:
    - '*.ximalaya.com'
  .*\.xima.*\.com:
    - '*.ximalaya.com'
  gslb.*\.xima.*\.com:
    - '*.ximalaya.com'
  xima\..*\.com:
    - '*.ximalaya.com'
  .*-spclient\.spotify\.com:
    - '*-spclient.spotify.com'
  .*flyert.*:
    - '*.flyert.com'
  .*zhijianmedia\.cn:
    - '*.zhijianmedia.cn'
  .*\.amap\.com:
    - m5.amap.com
    - m5-zb.amap.com
    - dualstack-m5.amap.com
    - oss.amap.com
    - optimus-ads.amap.com
    - u5.amap.com
    - page.amap.com
  (g-)?acs\.m\.goofish\.com:
    - acs.m.goofish.com
    - g-acs.m.goofish.com
  m?api\.weibo\.cn:
    - api.weibo.cn
    - mapi.weibo.cn
  m?api\.weibo\.com:
    - api.weibo.com
    - mapi.weibo.com
  m?api\.weibo\.c(n|om):
    - api.weibo.cn
    - mapi.weibo.cn
    - api.weibo.com
    - mapi.weibo.com
  .*cupid\.iqiyi\.com:
    - '*.cupid.iqiyi.com'
    - t7z.cupid.iqiyi.com
  '[a-z]+\.eastmoney\.com':
    - emdcad.eastmoney.com
    - app.eastmoney.com
  .*\.meituan\.com:
    - api.meituan.com
    - mapi.meituan.com
    - i.meituan.com
    - waimaiapi.meituan.com
  interface(\d)?\.music\.163\.com:
    - interface.music.163.com
    - interface3.music.163.com

# 银行 / 支付 / 12306 / 政务 / 微信与企业微信核心定位与安全域 不解密。
#
# 这不是「防广告」，是防「MITM 失败的后果」：这几类的证书校验（SSL Pinning）一旦触发，
# 后果是 App 打不开、付不了款、或企业微信打卡定位在获得初步坐标后立即因证书校验失败报「定位失败」。
#
# 注意粒度：这里写的是后缀，命中推导出的具体主机（如 adv.ccb.com / otheve.beacon.qq.com）。
deny_suffix:
  # 银行
  - bankcomm.com
  - bankcomm.cn
  - ccb.com
  - ecitic.com
  - pingan.com
  - spdb.com.cn
  - icbc.com.cn
  - abchina.com
  - abchina.com.cn
  - boc.cn
  - cmbchina.com
  - psbc.com
  # 支付 / 征信
  - unionpay.com
  - 95516.com
  - alipay.com
  - tenpay.com
  # 出行凭证 & 政务
  - 12306.cn
  - gov.cn
  # 企业微信 / 微信安全 / 腾讯地图定位 SDK / 灯塔 SDK（开启 SSL Pinning，MITM 会导致企业微信打卡定位失败）
  - work.weixin.qq.com
  - qyapi.weixin.qq.com
  - map.qq.com
  - beacon.qq.com
  - weixin110.qq.com
  - wechat.com
  - servicewechat.com
deny_exact:
  - '*.com.cn'
  - '*.net.cn'
  - '*.org.cn'
  - '*.gov.cn'
  - '*.com'
  - '*.cn'
  # 禁止国内高频超级 App 整域通配与裸主域（具体业务接口已由 overrides 或精确子域指定）
  - '*.qq.com'
  - 'qq.com'
  - '*.l.qq.com'
  - 'l.qq.com'
  - '*.weixin.qq.com'
  - 'weixin.qq.com'
  - '*.tencent.com'
  - 'tencent.com'
  - '*.myqcloud.com'
  - 'myqcloud.com'
  - '*.qcloud.com'
  - 'qcloud.com'
  - '*.baidu.com'
  - 'baidu.com'
  - '*.pcs.baidu.com'
  - 'pcs.baidu.com'
