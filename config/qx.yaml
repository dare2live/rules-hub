# Quantumult X 侧的映射与图标
# 改这里就能改 QX 输出，不需要动 Python。

# 全端策略组名 -> QX 里的显示名。
# QX 内置 direct / reject / proxy，其余组名沿用 config.yaml 的定义。
name_map:
  DIRECT: direct
  REJECT: reject
  Proxy: 全球加速
  Media: 国际媒体

# ===== 需要自托管的外部资源 =====
#
# 为什么必须在这里列一份，而不是让构建时自动扫描：
#   个人配置里的 resource_parser_url / task_local 脚本来自 user_qx_input.txt，
#   而那个文件是 gitignore 的 —— CI 上根本没有它。如果靠扫描配置来发现要镜像什么，
#   CI 就会漏掉这些，生成出来的自托管链接在 GitHub Pages 上全是 404
#   （比直接用上游链接还糟）。列在这里，本地和 CI 走同一份清单，产物必然一致。
#
# 镜像产物落在 dist/qx/scripts/，对外地址 {base_url}/qx/scripts/<hash>-<原名>。
assets:
  # QX 资源解析器：在 QX 里「引用」新资源时会调用它，拉不到就添加失败
  resource_parser: https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
  # 流媒体解锁查询（[task_local] 的 event-interaction）
  streaming_ui_check: https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/streaming-ui-check.js

# 策略组图标（img-url）。没有图标的组不加 img-url 参数，不影响功能。
#
# 注意：这些地址会在构建时被镜像到自托管（dist/qx/scripts/），所以填上游地址即可，
# 设备端拿到的是我们自己的链接，上游删了也不影响。
# 但上游地址本身必须是 200 —— 404 的图标镜像不了，会保留死链，
# 表现为「策略组没图标，且每次加载配置都要去请求一个不存在的图」。
# Claude.png / Tencent.png 上游已删（2026-11 实测 404），换成同仓库仍在的 AI / Bot / WeChat。
icons:
  Claude: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png
  GoogleAI: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google.png
  # 策略组名跟腾讯产品名一致：WorkBuddy = 国内版，WorkBuddy AI = 海外版
  WorkBuddy: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/WeChat.png
  WorkBuddy AI: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/WeChat.png
  OpenAI: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
  全球加速: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png
  国际媒体: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Streaming.png
  兜底分流: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png
  自动选择: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png

# [policy] 段的输出顺序。
# 顺序是硬要求：被别的组引用的组必须先定义，否则 QX 报前向引用错误。
policy_order:
  - Proxy
  - Media
  - Claude
  - GoogleAI
  - OpenAI
  - WorkBuddy
  - WorkBuddy AI

# 规则集 id -> QX 侧 tag 名
tag_map:
  unbreak: 规则修正
  custom_direct: 个人直连
  workbuddy_cn: WorkBuddy
  workbuddy: WorkBuddy AI
  claude: Claude
  google_ai: GoogleAI
  media: 国际媒体
  openai: OpenAI
  tiktok: TikTok
  proxy: 全球加速
  reject: 广告拦截

# 导入 QX 时必须存在的段落，缺任意一个都会被判为非法配置。
# 历史教训：线上 profile 曾缺 rewrite_local 等 4 段，表现为「导入成功但重写全部静默失效」。
required_sections:
  - general
  - dns
  - policy
  - server_local
  - server_remote
  - filter_local
  - filter_remote
  - rewrite_local
  - rewrite_remote
  - task_local
  - http_backend
  - mitm

# 国内解析器。直连域名的 DNS 一律指向它，
# 否则境外解析器会把国内 CDN 指到境外节点，再被 geoip 判成非 CN 送进代理。
domestic_dns: 223.5.5.5
