rules:
  # ===== 1. 进程级（macOS 专享，域名规则漏了也能兜住）=====
  - PROCESS-NAME,Claude,Claude
  - PROCESS-NAME,Gemini,GoogleAI
  - PROCESS-NAME,agy,GoogleAI
  - PROCESS-NAME,GeminiAppLauncher,GoogleAI
  - PROCESS-NAME,WorkBuddy AI,WorkBuddy
  - PROCESS-NAME,codebuddy,WorkBuddy
  # ===== 2. 局域网与自己的服务器：直连，不绕道 =====
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  # 把「代理服务器自己的公网 IP」也放进直连，避免流量绕回自己形成环路。
  # 真实 IP 由个人配置生成时填入，公开示例里用 TEST-NET-3 占位。
  - IP-CIDR,203.0.113.10/32,DIRECT,no-resolve
  - DOMAIN-SUFFIX,lifehackers.cc,DIRECT
  - DOMAIN,sharewithyou.dpdns.org,DIRECT
  # ===== 3. 规则集（远程托管，每日自动更新）=====
  - RULE-SET,unbreak,DIRECT
  - RULE-SET,custom_direct,DIRECT
  - RULE-SET,claude,Claude
  - RULE-SET,google_ai,GoogleAI
  - RULE-SET,workbuddy,WorkBuddy
  - RULE-SET,media,Media
  - RULE-SET,openai,OpenAI
  - RULE-SET,tiktok,Proxy
  - RULE-SET,proxy,Proxy
  - RULE-SET,reject,REJECT
  - GEOIP,CN,DIRECT
  - MATCH,Proxy

