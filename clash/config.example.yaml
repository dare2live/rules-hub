    path: ./rules/custom_direct.yaml
  claude:
    type: http
    behavior: classical
    format: yaml
    url: 'https://dare2live.github.io/rules-hub/clash/rules/claude.yaml'
    interval: 86400
    path: ./rules/claude.yaml
  google_ai:
