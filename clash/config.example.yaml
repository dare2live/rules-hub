# ===== Rules Hub — Clash (mihomo) 配置模板 =====
# 适用客户端：ProjectClash/Clash-Client（iOS / iPadOS / macOS / tvOS）
# 规则源：https://dare2live.github.io/rules-hub/clash/rules/  （每日自动更新，客户端按 interval 拉取）
#
# 这是公开模板，不含任何真实节点。两种用法：
#   1) 把自己的节点填进 proxies: 段，替换掉下面的占位项
#   2) 用 proxy-providers: 挂自己的订阅链接，节点自动更新
# 想省事就直接用本地生成的 Clash_Personal.yaml（已含节点，不进仓库）。

mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'stun.*.*'
    - '+.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.microsoft.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 全部走国内 DoH。境外域名不在这里解析：
  # 域名会原样交给节点，由节点侧解析，本地不产生任何境外查询。
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    'geosite:cn,private':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

geodata-mode: true
geo-auto-update: true
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb

# 占位节点：换成自己的，或改用下面的 proxy-providers
proxies:
  - name: 'Lightsail Singapore HY2'
    type: ss
    server: 127.0.0.1
    port: 8388
    cipher: chacha20-ietf-poly1305
    password: 'REPLACE_ME'
    udp: true
  - name: 'Lightsail Singapore'
    type: ss
    server: 127.0.0.1
    port: 8388
    cipher: chacha20-ietf-poly1305
    password: 'REPLACE_ME'
    udp: true
  - name: 'Oracle San Jose'
    type: ss
    server: 127.0.0.1
    port: 8388
    cipher: chacha20-ietf-poly1305
    password: 'REPLACE_ME'
    udp: true
  - name: 'Google Oregon'
    type: ss
    server: 127.0.0.1
    port: 8388
    cipher: chacha20-ietf-poly1305
    password: 'REPLACE_ME'
    udp: true

# 有订阅链接的话，用这个替代上面的 proxies（节点会自动更新）
# proxy-providers:
#   my-sub:
#     type: http
#     url: 'https://example.com/sub?token=xxx'
#     interval: 86400
#     path: ./providers/my-sub.yaml
#     health-check:
#       enable: true
#       url: http://cp.cloudflare.com/generate_204
#       interval: 300

proxy-groups:
  - name: '🇸🇬 新加坡自动备用'
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 30
    tolerance: 50
    proxies:
      - 'Lightsail Singapore HY2'
      - 'Lightsail Singapore'
  - name: '🇺🇸 美国自动优选'
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - 'Oracle San Jose'
      - 'Google Oregon'
  - name: 'Claude'
    type: select
    proxies:
      - 'Lightsail Singapore HY2'
      - 'Lightsail Singapore'
      - '🇸🇬 新加坡自动备用'
      - DIRECT
  - name: 'GoogleAI'
    type: select
    proxies:
      - '🇺🇸 美国自动优选'
      - '🇸🇬 新加坡自动备用'
      - 'Oracle San Jose'
      - 'Lightsail Singapore HY2'
      - 'Proxy'
      - DIRECT
  - name: 'OpenAI'
    type: select
    proxies:
      - '🇺🇸 美国自动优选'
      - 'Oracle San Jose'
      - 'Google Oregon'
      - '🇸🇬 新加坡自动备用'
      - DIRECT
  - name: 'WorkBuddy'
    type: select
    proxies:
      - '🇸🇬 新加坡自动备用'
      - 'Proxy'
      - 'DIRECT'
  - name: 'Proxy'
    type: select
    proxies:
      - '🇸🇬 新加坡自动备用'
      - '🇺🇸 美国自动优选'
      - 'Lightsail Singapore HY2'
      - 'Oracle San Jose'
      - 'Google Oregon'
      - 'Lightsail Singapore'
      - DIRECT
  - name: 'Media'
    type: select
    proxies:
      - '🇸🇬 新加坡自动备用'
      - '🇺🇸 美国自动优选'
      - 'Proxy'
      - DIRECT

