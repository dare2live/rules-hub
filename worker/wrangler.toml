name = "rules-personal"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 个人配置（含节点明文口令）只存在 KV 里，永不进 git、永不进 gh-pages。
# 路径首段是 32 字节随机口令，不匹配一律 404。
kv_namespaces = [
  { binding = "RULES_PERSONAL", id = "d5b9b4cdbceb45149d735f46d422a94f" }
]

# 刻意不绑自定义域名。
# 主站/主域（lifehackers.cc）同时跑着 edgetunnel 这类服务，是 GFW 的重点目标；
# 规则和配置的更新入口一旦跟着主域一起挂，就没法自救。所以这里只用
# Cloudflare 自己的 workers.dev，跟自有域名、VPS 全部解耦。
workers_dev = true
# 预览地址会多出一批可访问入口，关掉减少暴露面
preview_urls = false

[vars]
# 对外分发地址（publish_private.py 读它来打印链接）
DIST_URL = "https://rules-personal.herokuv2.workers.dev"

# 想再加一条自有域名入口的话，取消下面注释后 `wrangler deploy` 即可：
# routes = [{ pattern = "rules.example.com", custom_domain = true }]

[observability]
enabled = true
