// ==UserScript==
// @ScriptName        高德地图净化[安全版]
// @Author            本地维护（基于 @ddgksf2013 AmapAds V1.0.28 精简）
// @Version           V2.0.0
// @Attention         只保留「纯广告请求」的直接拦截，不使用任何脚本改写响应体
// ==/UserScript==

// 为什么有这个文件：
// 上游 AmapAds.conf（V1.0.28，脚本停更于 2025-08-30）把 8 个业务接口交给
// 830f361b-amap.js 做 script-response-body 改写。该脚本顶部无条件执行
// JSON.parse($response.body)，没有任何 try/catch。高德接口一旦返回非 JSON
// （protobuf / 空响应 / 网关错误页），脚本抛异常后拿不到 $done，QX 的请求
// 就一直挂着直到超时 —— 表现为「我的页面加载不出」「首页网络不畅」「发送车机失败」，
// 且不报任何错误。
// 另外它对「我的页面」的 cardList 做 dataType 白名单过滤，高德改版后字段对不上
// 就会把整页卡片清空。
// 所以这里只留「拦截后不影响任何功能」的广告请求，其余一律不碰。

hostname = *.amap.com

# > 高德地图_开屏请求
^https?:\/\/.*\.amap\.com\/ws\/aos\/alimama\/splash_screen url reject-200
# > 高德地图_开屏广告
^https?:\/\/.*\.amap\.com\/ws\/valueadded\/alimama\/splash_screen url reject-200
# > 高德地图_通用广告请求
^https?:\/\/.*\.amap\.com\/ws\/asa\/ads_attribution url reject
# > 高德地图_首页左上角gif
^https?:\/\/.*\.amap\.com\/uploadimg\/\w+\.gif url reject-img
# > 高德地图_路线规划下方广告
^https?:\/\/.*\.amap\.com\/ws\/faas\/amap-navigation\/card-service-route-plan\? url reject-dict
