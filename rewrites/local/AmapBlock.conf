// ==UserScript==
// @ScriptName        高德地图净化
// @Author            本地维护
// @Version           V3.0.0
// @Attention         广告请求直接拦截 + 内容卡片按标题删除，合并为单一订阅
// ==/UserScript//

// 为什么自己维护，不用上游 AmapAds.conf：
// 上游（V1.0.28，脚本停更于 2025-08-30）把 8 个业务接口交给 830f361b-amap.js
// 做 script-response-body 改写，该脚本顶部无条件执行 JSON.parse($response.body)
// 且没有 try/catch。高德接口一旦返回非 JSON（protobuf / 空响应 / 网关错误页），
// 脚本抛异常后拿不到 $done，QX 的请求就一直挂着直到超时 —— 表现为
// 「我的页面加载不出」「首页网络不畅」「发送车机失败」，且不报任何错。
// 另外它对 cardList 做 dataType 白名单过滤，高德改版后字段对不上会清空整页。
//
// 本文件分两段，判断一条规则该放哪段的依据：
//   响应里有可见文字（卡片标题）→ 第二段，删卡片
//   纯图片位 / 推荐流 / 资源位          → 第一段，拦请求

hostname = *.amap.com

# ============ 第一段：纯广告请求，直接拦截 ============

# > 开屏请求
^https?:\/\/.*\.amap\.com\/ws\/aos\/alimama\/splash_screen url reject-200
# > 开屏广告
^https?:\/\/.*\.amap\.com\/ws\/valueadded\/alimama\/splash_screen url reject-200
# > 通用广告请求
# 用 reject-200 而不是 reject：reject 是连接层硬拒绝，App 的网络监控会捕捉到
# 并可能降级（表现为「网络不畅」）；reject-200 返回正常 200 空响应，对 App 隐形。
^https?:\/\/.*\.amap\.com\/ws\/asa\/ads_attribution url reject-200
# > 首页左上角 gif
^https?:\/\/.*\.amap\.com\/uploadimg\/\w+\.gif url reject-img
# > 首页海报墙 / 运营横幅（oss 域，纯图片位，只能拦请求）
^https?:\/\/oss\.amap\.com\/ws\/banner\/lists url reject-dict
# > 搜索框场景推荐
^https?:\/\/.*\.amap\.com\/ws\/shield\/scene\/recommend url reject-dict

# [刻意不拦] 路线规划下方广告
#   ^https?:\/\/.*\.amap\.com\/ws\/faas\/amap-navigation\/card-service-route-plan\? url reject-dict
# 接口名是 card-service-route-plan（路线规划卡片服务），「发送到车机」正是它的下游
# 功能。reject-dict 会连功能入口一起拒绝 —— 实测首页报「网络不畅」的同时
# 路线推送车机功能一并失效。省一张广告卡不值得丢掉车机推送。

# ============ 第二段：内容卡片，交给脚本净化 ============
# amap.trim.js：按标题关键字删卡片（简繁双语）+ 推荐流清空列表。
# 全程异常兜底，非 JSON 一律原样放行，保证走到 $done。

# > AI 推荐流（首页底部信息流）：清空列表而非拒绝请求
#   这里曾用 reject-dict，结果 App 判定「请求失败」，整块信息流被渲染成
#   「网络不畅，请稍后重试」——卡片是没了，换来一行错误文案。
^https?:\/\/.*\.amap\.com\/v\d\/ai_rec\/ url script-response-body https://dare2live.github.io/rules-hub/qx/rewrites/amap.trim.js
# > 我的页面（达人任务 / 好友动态 / 猜你喜欢）
^https?:\/\/.*\.amap\.com\/ws\/shield\/dsp\/profile\/index\/nodefaas url script-response-body https://dare2live.github.io/rules-hub/qx/rewrites/amap.trim.js
# > 首页主页面（底部信息流）
^https?:\/\/.*\.amap\.com\/ws\/faas\/amap-navigation\/main-page url script-response-body https://dare2live.github.io/rules-hub/qx/rewrites/amap.trim.js
# > 附近推荐
^https?:\/\/.*\.amap\.com\/ws\/shield\/search\/nearbyrec_smart url script-response-body https://dare2live.github.io/rules-hub/qx/rewrites/amap.trim.js
