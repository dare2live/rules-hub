// ==UserScript==
// @ScriptName        高德地图内容净化[本地维护]
// @Version           V1.0.0
// @Attention         只按标题文本做黑名单删除，不做白名单保留
// ==/UserScript==

// 为什么单独一个文件：
//   AmapSafe.conf 只拦纯广告请求（reject 类），完全不碰响应体。
//   这里是内容净化，要改写响应体，风险等级不同 —— 分开成两个订阅，
//   万一出问题可以只关这一个，不用把广告拦截一起关掉。
//
// 上游（AmapAds.conf / 830f361b-amap.js，停更于 2025-08-30）没有覆盖
// 「猜你喜欢 / 达人任务 / 好友动态」——好友动态是 2026 年扫街榜的新功能，
// 达人任务来自高德达人计划，都比上游脚本新。

hostname = *.amap.com

# > 高德_我的页面（达人任务 / 好友动态 等社区卡片）
^https?:\/\/.*\.amap\.com\/ws\/shield\/dsp\/profile\/index\/nodefaas url script-response-body https://dare2live.github.io/rules-hub/qx/rewrites/amap.clean.js
# > 高德_首页底部信息流（猜你喜欢）
^https?:\/\/.*\.amap\.com\/ws\/faas\/amap-navigation\/main-page url script-response-body https://dare2live.github.io/rules-hub/qx/rewrites/amap.clean.js
# > 高德_首页信息流推荐
^https?:\/\/.*\.amap\.com\/v\d\/ai_rec\/ url script-response-body https://dare2live.github.io/rules-hub/qx/rewrites/amap.clean.js
# > 高德_附近推荐
^https?:\/\/.*\.amap\.com\/ws\/shield\/search\/nearbyrec_smart url script-response-body https://dare2live.github.io/rules-hub/qx/rewrites/amap.clean.js
