// ==UserScript==
// @ScriptName        高德地图内容净化[本地维护]
// @Version           V2.0.0
// @Attention         按标题文本做黑名单删除；cardList 为对象或数组都能处理
// ==/UserScript==

// v2 改动：v1 完全没效果，两个原因 ——
//   1) 脚本只按数组处理 cardList，而高德返回的是 {key: card} 对象，
//      Array.isArray 为 false，一次都没进去过。v2 补了对象的 delete 分支。
//   2) 原先还挂了 v\d/ai_rec/ 让它改响应体，但上游对这个接口是直接 reject-dict。
//      推荐流多为图片位、响应里没有文字，改响应体拦不住 ——
//      已移到 AmapSafe.conf 走 reject-dict。
//
// 单独一个文件的原因：内容净化要改写响应体，风险等级和纯 reject 不一样，
// 出问题可以只关这一条，不用把广告拦截一起关掉。
//
// 上游（830f361b-amap.js，停更于 2025-08-30）没有覆盖
// 「猜你喜欢 / 达人任务 / 好友动态」——好友动态是 2026 年扫街榜的新功能。

hostname = *.amap.com

# > 高德_我的页面（达人任务 / 好友动态 / 猜你喜欢 等社区卡片）
^https?:\/\/.*\.amap\.com\/ws\/shield\/dsp\/profile\/index\/nodefaas url script-response-body https://dare2live.github.io/rules-hub/qx/rewrites/amap.cards.js
# > 高德_首页主页面（底部信息流）
^https?:\/\/.*\.amap\.com\/ws\/faas\/amap-navigation\/main-page url script-response-body https://dare2live.github.io/rules-hub/qx/rewrites/amap.cards.js
# > 高德_附近推荐
^https?:\/\/.*\.amap\.com\/ws\/shield\/search\/nearbyrec_smart url script-response-body https://dare2live.github.io/rules-hub/qx/rewrites/amap.cards.js
