name: Build and Deploy Rules Hub

on:
  push:
    branches:
      - main
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动同步上游规则并发布
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # 审计脚本要用 git log 判断本地文件的最后变更时间，浅克隆会让所有文件都变成“今天”。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pyyaml

      - name: Run Rules Compiler (with Upstream Sync)
        run: |
          python generator/build.py

      - name: Rules lint gate (strict)
        # 冲突 > 0 时阻断发布；检查对象是刚生成的 dist/qx/*.list
        run: |
          python scripts/rules_lint.py --no-write --strict

      - name: Privacy guard (HEAD full scan)
        # 与本地 pre-commit 共用 config/privacy_patterns.txt，避免三处漂移
        run: |
          sh scripts/precommit_guard.sh --all

      - name: Audit upstream health (read-only)
        # 只观测，不产出给设备的文件；失败不阻塞构建与发布。
        continue-on-error: true
        run: |
          python scripts/upstream_audit.py | tee /tmp/audit.out
          REPORT=$(sed -n 's/^报告：//p' /tmp/audit.out | tail -1)
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare Deployment Artifacts
        run: |
          cp dist/web/index.html dist/index.html

      - name: Mirror dist to gh-pages branch (jsDelivr fallback source)
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages 无变更，跳过镜像"
          else
            git commit -q -m "chore(auto): mirror dist for jsDelivr [skip ci]"
            git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
            echo "已镜像到 gh-pages，jsDelivr 备用源: https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages"
          fi
          rm -rf .git

      - name: Commit fresh cached files (if on schedule)
        if: github.event_name == 'schedule'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rewrites/cached/ 2>/dev/null || true
          git add data/ 2>/dev/null || true
          git add docs/UPSTREAM_AUDIT_*.md 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily upstream rules sync [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
