# rules-hub 配置文件
# 单一数据源：在此定义策略组、规则集与目标映射，由生成器一键编译为 Surge、QX、小火箭、软路由配置

meta:
  name: "Rules Hub"
  author: "dare2live"
  base_url: "https://dare2live.github.io/rules-hub"  # 默认使用原生免配置的 GitHub Pages（也可换为 Cloudflare Pages: https://rules-hub.pages.dev）
  # 备用下载源：GitHub Pages 在国内时通时不通，软路由同步失败时自动回退到这里。
  # 由 CI 把 dist/ 推送到 gh-pages 分支，jsDelivr 直接读取该分支。
  # 留空则关闭回退。
  base_url_bak: "https://cdn.jsdelivr.net/gh/dare2live/rules-hub@gh-pages"
  managed_interval: 86400  # 自动同步刷新周期（秒）

# 软路由（华硕梅林 fancyss）订阅与自动更新
router:
  # 每周日 04:10 自动同步（cron 语法，5 段）
  cron: "10 4 * * 0"
  # chnroute / gfwlist / cdn 上游数据刷新周期（天），编译时超过该天数会重新拉取
  data_refresh_days: 7
  # 是否同步 cdn.txt（国内 CDN 域名，约 11 万条）。若路由器 DNS 变慢可置为 false
  update_cdn: true

# 1. 核心业务策略组定义（全端统一收敛至固定几个黄金策略组）
policies:
  - name: "DIRECT"
    type: "direct"
    desc: "国内直连（微信、企业微信、钉钉、国内银行、内网）"

  - name: "Claude"
    type: "select"
    desc: "Claude 专属通道（锁定新加坡）"
    # QX 侧默认选中项（成员列表第一个）
    qx_default: "Lightsail Singapore"
    default_select: "🇸🇬 新加坡自动备用"
    proxies:
      - "Lightsail Singapore HY2"
      - "Lightsail Singapore"
      - "🇸🇬 新加坡自动备用"

  - name: "GoogleAI"
    type: "select"
    desc: "Gemini / Antigravity 专属通道（美区优选/新加坡，杜绝香港）"
    # QX 侧默认选中项（成员列表第一个）
    qx_default: "proxy"
    default_select: "🇺🇸 美国自动优选"
    proxies:
      - "🇺🇸 美国自动优选"
      - "🇸🇬 新加坡自动备用"
      - "Oracle San Jose"
      - "Lightsail Singapore HY2"
      - "Proxy"

  - name: "OpenAI"
    type: "select"
    desc: "ChatGPT / Codex 专属通道（锁定美区，OpenAI 对新加坡出口风控更严）"
    # QX 侧默认选中项（成员列表第一个）
    qx_default: "proxy"
    default_select: "🇺🇸 美国自动优选"
    proxies:
      - "🇺🇸 美国自动优选"
      - "Oracle San Jose"
      - "Google Oregon"
      - "🇸🇬 新加坡自动备用"

  - name: "WorkBuddyCN"
    type: "select"
    desc: "WorkBuddy 国内服务（workbuddy.cn / codebuddy.cn / copilot.tencent.com），默认直连"
    # QX 侧默认选中项（成员列表第一个）
    qx_default: "DIRECT"
    default_select: "DIRECT"
    proxies:
      - "DIRECT"
      - "🇸🇬 新加坡自动备用"

  - name: "WorkBuddy"
    type: "select"
    desc: "腾讯 WorkBuddy AI 加速通道（境外侧，走新加坡）"
    # QX 侧默认选中项（成员列表第一个）
    #
    # 这里不能写 proxy：QX 的 proxy 是「跟随当前全局选中的节点」。
    # 全局节点平时多半锁在美国（ChatGPT / Gemini 用），
    # WorkBuddy 的接口在腾讯云新加坡，绕美国一圈会多出 200~400ms RTT，
    # 表现出来就是「客户端能开但慢得离谱」。直接钉死新加坡节点。
    qx_default: "Lightsail Singapore"
    default_select: "🇸🇬 新加坡自动备用"
    proxies:
      - "🇸🇬 新加坡自动备用"
      # QX 里没有 fallback 组（那是 Surge 的写法），必须直接列出节点，
      # 否则 WorkBuddy 组只剩「全球加速 / direct / proxy」三个成员，
      # qx_default 找不到目标就被静默忽略，最后又退回跟随全局节点。
      - "Lightsail Singapore"
      - "Proxy"
      - "DIRECT"

  - name: "Proxy"
    type: "select"
    desc: "全球通用外网加速（X、GitHub、Google 搜索）"
    # QX 侧默认选中项（成员列表第一个）
    qx_default: "proxy"
    default_select: "🇸🇬 新加坡自动备用"
    proxies:
      - "🇸🇬 新加坡自动备用"
      - "🇺🇸 美国自动优选"
      - "Lightsail Singapore HY2"
      - "Oracle San Jose"
      - "Google Oregon"
      - "Lightsail Singapore"

  - name: "Media"
    type: "select"
    desc: "国际流媒体（YouTube、Netflix、Spotify）"
    # QX 侧默认选中项（成员列表第一个）
    qx_default: "proxy"
    default_select: "🇸🇬 新加坡自动备用"
    proxies:
      - "🇸🇬 新加坡自动备用"
      - "🇺🇸 美国自动优选"
      - "Proxy"

  - name: "REJECT"
    type: "reject"
    desc: "广告与隐私追踪拦截"

# 2. 自动化容灾与健康检查节点池
fallback_groups:
  - name: "🇸🇬 新加坡自动备用"
    type: "fallback"
    test_url: "http://cp.cloudflare.com/generate_204"
    interval: 30
    tolerance: 50
    proxies:
      - "Lightsail Singapore HY2"
      - "Lightsail Singapore"

  - name: "🇺🇸 美国自动优选"
    type: "url-test"
    test_url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "Oracle San Jose"
      - "Google Oregon"

# 3. 规则分类与策略映射（本地定制 + 开源知名上游自动融合）
rule_sources:
  # 顺序 = 匹配优先级（QX 按 filter_remote 列表从上到下命中，先中先算）。
  # 原则：范围越窄的越靠前，范围越宽的越靠后。
  # custom_direct 里有 tencent.com / myqcloud.com / qcloud.com 这类大后缀，
  # 放到前面会把 workbuddy-cn 的 copilot.tencent.com、
  # workbuddy 的 cos.ap-singapore.myqcloud.com 全部吃掉，
  # 表现为「策略组切了没反应」和「海外版资源被强制直连」。
  - id: "unbreak"
    target: "DIRECT"
    file: "rules/unbreak.txt"
    desc: "防误杀白名单（最高优先级，对所有上游广告规则具备一票豁免权）"

  - id: "claude"
    target: "Claude"
    file: "rules/claude.txt"
    desc: "Claude & Anthropic 全生态"
    process:
      - "Claude"
    upstream_urls:
      - "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Claude/Claude.list"

  - id: "google_ai"
    target: "GoogleAI"
    file: "rules/google-ai.txt"
    desc: "Gemini / Antigravity / Google Cloud Code"
    process:
      - "Gemini"
      - "agy"
      - "GeminiAppLauncher"
    upstream_urls:
      - "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Gemini/Gemini.list"

  # 两个客户端（国版 WorkBuddy / 海外版 WorkBuddy AI）共用同一套后端，
  # app.asar 里的域名集合 553 条零差异，进程名都是 Electron —— 分不出身份。
  # 所以按「域名归属」拆：国内域名走 WorkBuddyCN（直连），境外域名走 WorkBuddy（新加坡）。
  # 这一条必须排在 workbuddy 之前，否则国内域名会被后面的 KEYWORD 兜底送进代理。
  - id: "workbuddy_cn"
    target: "WorkBuddyCN"
    file: "rules/workbuddy-cn.txt"
    desc: "WorkBuddy / CodeBuddy 国内服务（腾讯云北京、广州），直连"

  - id: "workbuddy"
    target: "WorkBuddy"
    file: "rules/workbuddy.txt"
    desc: "WorkBuddy / CodeBuddy 境外侧，走新加坡"
    # macOS 上两个客户端的可执行文件都叫 Electron，PROCESS-NAME 永远匹配不上，
    # 写进 Surge 就是死规则，所以限定只在 QX 侧输出（iOS 进程名是有效的）。
    # Mac 上两者靠域名区分：见 workbuddy_cn（.cn 直连）与本条（.ai 走新加坡）。
    process_platforms: ["qx"]
    process:
      - "WorkBuddy AI"
      - "codebuddy"

  - id: "media"
    target: "Media"
    file: "rules/media.txt"
    desc: "主流海外流媒体服务"
    upstream_urls:
      - "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTube/YouTube.list"
      - "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Netflix/Netflix.list"
      - "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Spotify/Spotify.list"

  - id: "openai"
    target: "OpenAI"
    file: "rules/openai.txt"
    desc: "OpenAI / ChatGPT / Sora（锁定美区出口）"
    upstream_urls:
      - "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list"

  - id: "tiktok"
    target: "Proxy"
    file: "rules/tiktok.txt"
    desc: "TikTok 全生态"
    upstream_urls:
      - "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/TikTok/TikTok.list"

  - id: "proxy"
    target: "Proxy"
    file: "rules/proxy.txt"
    desc: "通用海外常用站点（弥补老旧 GFWList 缺失的现代海外站点与 Stremio 详情页海报）"

  # 放在业务列表之后：这里是大范围直连兜底（腾讯 / 阿里 / 字节 / 银行…），
  # 只有前面没有更具体的业务规则时才由它接管。
  # 放前面会「吃掉」workbuddy-cn 与 workbuddy 里的子域规则。
  - id: "custom_direct"
    target: "DIRECT"
    file: "rules/direct.txt"
    desc: "个人专属项目直连、微信、企业微信、国内银行"

  - id: "reject"
    target: "REJECT"
    file: "rules/reject.txt"
    desc: "广告与数据分析追踪"
    upstream_urls:
      - "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising.list"

  - id: "china_geoip"
    target: "DIRECT"
    type: "GEOIP"
    country: "CN"
    desc: "国内 IP GeoIP 精准直连"

  - id: "final"
    target: "Proxy"
    type: "FINAL"
    desc: "外网漏斗兜底"

# 4. 重写规则自托管镜像与同步（每日 04:00 自动拉取上游保持最新，提供高速免翻墙分发）
rewrites:
  # ======= 核心去广告与开屏拦截 ======= #
  - id: "startup_ads"
    name: "墨鱼去开屏2.0@ddgksf2013"
    filename: "StartUpAds.conf"
    upstream_url: "https://ddgksf2013.top/rewrite/StartUpAds.conf"
    opt_parser: false
    enabled: true
    desc: "全网主流应用开屏广告拦截（源站按 UA 放行，已适配 Quantumult UA 抓取）"

  - id: "youtube_ads"
    name: "油管去广告@Maasea"
    filename: "YoutubeAds.conf"
    upstream_url: "https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/YoutubeAds.conf"
    opt_parser: false
    enabled: true
    desc: "YouTube 视频、瀑布流、短视频广告拦截与画中画支持"

  - id: "weibo_ads"
    name: "微博去广告@ddgksf2013"
    filename: "WeiboAds.conf"
    upstream_url: "https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/WeiboAds.conf"
    opt_parser: false
    enabled: true
    desc: "微博去开屏、去信息流广告与热搜净化"

  - id: "ximalaya_ads"
    name: "喜马拉雅去广告[卸载重装]@ddgksf2013"
    filename: "Ximalaya.conf"
    upstream_url: "https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/Ximalaya.conf"
    opt_parser: false
    enabled: true
    desc: "喜马拉雅去弹窗、横幅及音频流广告"

  - id: "amap_block"
    name: "高德地图净化[本地维护]"
    filename: "AmapBlock.conf"
    # 单一订阅：合并了原来的「安全版」(纯 reject 拦广告请求) 和
    # 「内容净化」(脚本改响应体删卡片) 两条，重写列表里只留一条。
    # 上游 AmapAds.conf 彻底弃用 —— 它把 8 个业务接口交给 830f361b-amap.js 改写，
    # 该脚本顶部无条件 JSON.parse($response.body) 且没有 try/catch，高德接口只要
    # 返回非 JSON 就抛异常、拿不到 $done，QX 请求挂死到超时，表现为「页面加载不出」
    # 「首页网络不畅」「发送车机失败」且不报任何错。连条目都不保留 ——
    # 留着只会在重写列表里多一条默认不选中的死订阅。
    local_file: "rewrites/local/AmapBlock.conf"
    opt_parser: false
    enabled: true
    desc: "拦截广告请求 + 按标题删除猜你喜欢 / 达人任务 / 好友动态"

  - id: "amap_clean_script"
    name: "高德内容净化脚本[本地维护]"
    filename: "amap.trim.v6.js"
    # mirror_only：只把脚本自托管出去，供 AmapBlock.conf 用 script-response-body
    # 引用。它本身不是订阅条目 —— 自包含重写靠头部注释里的 [rewrite_local]
    # 声明块生效，本文件没有那个块，挂成订阅就是提取不到规则的无效条目。
    # 注意：改脚本内容必须换文件名，QX 按 URL 缓存脚本本体，同名改内容设备不重下。
    mirror_only: true
    local_file: "rewrites/local/amap.trim.v6.js"
    opt_parser: true
    enabled: true
    desc: "高德内容净化脚本（按 dataType 整卡删除，全程异常兜底）"

  # [已删除 2026-11] 微信小程序去广告@ddgksf2013
  # 结论：无法接着开发，网络层方案对小程序广告无效 —— 这是平台机制不是规则问题。
  #   1. 小程序开屏广告由微信客户端内核托管（wx.showSplashScreen 生命周期完全在
  #      微信侧，开发者拿不到 DOM / 句柄，无法 destroy），网络层改不掉。
  #   2. 该订阅停更于 2023-09-13，只 5 条规则，针对便利蜂 / 顺丰速运 / 掌上公交等
  #      2023 年的特定小程序，hostname 是 *.top / *.xyz 野鸡域名，日常小程序
  #      不可能命中 —— 所以表现为「默认选中但完全没效果」。
  #   3. 作者自己也在文件头写明「无法去除小程序5s开屏广告，建议开启青少年模式」。
  # 替代方案：微信 → 我 → 设置 → 青少年模式（屏蔽大部分小程序广告，代价是限制功能）。

  - id: "xiaohongshu_ads"
    name: "小红书净化+去水印@奶思"
    filename: "XiaoHongShuAds.conf"
    upstream_url: "https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/rewrite/split/partX/Xiaohongshu.snippet"
    opt_parser: false
    enabled: true
    desc: "小红书瀑布流广告拦截与无水印原图保存（已迁移至 wool_scripts 维护源）"

  - id: "xueqiu_ads"
    name: "雪球净化@奶思"
    filename: "XueQiuAds.conf"
    upstream_url: "https://raw.githubusercontent.com/fmz200/wool_scripts/main/QuantumultX/rewrite/split/partX/XueQiu.snippet"
    opt_parser: false
    enabled: true
    desc: "雪球开屏与社区推广信息净化（已迁移至 wool_scripts 维护源）"

  - id: "goofish_ads"
    name: "闲鱼净化"
    filename: "GoofishAds.conf"
    upstream_url: "https://raw.githubusercontent.com/ddgksf2013/Rewrite/refs/heads/master/AdBlock/GoofishAds.conf"
    opt_parser: true
    enabled: true
    desc: "闲鱼首页推荐流及商品卡片净化"

  # ======= VIP 解锁与体验增强 ======= #
  - id: "spotify_vip"
    name: "Spotify音乐VIP[音质≤高]@app2smile"
    filename: "spotify.conf"
    upstream_url: "https://raw.githubusercontent.com/app2smile/rules/master/module/spotify.conf"
    opt_parser: false
    enabled: true
    desc: "Spotify 歌曲切歌、无杂音、音质解锁"

