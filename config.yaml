  - id: "missav"
    name: "MissAV"
    filename: "missav.clean.js"
    # 上游版本停在 2025.12，站点广告位已换成 go.mayzaent.com / t.rallytrck.website，
    # 上游选择器一个都没覆盖到，所以改为本地维护。
    # v2（missav.clean.js）补掉了「内容已屏蔽但透明浮层和关闭 X 还在」的问题：
